[workspace]
members = [
    "crates/cordis",
    "crates/cordis-core",
    "crates/cordis-guest",
    "crates/cordis-cli",
    "crates/cordis-logger",
    "crates/cordis-loader",
    "crates/cordis-macros",
    "crates/cordis-timer",
    "crates/cordis-wasm",
    "examples/wasm-counter-consumer",
    "examples/wasm-counter-provider",
    "examples/wasm-log-plugin",
    "examples/hybrid-http-gateway",
    "examples/config-hybrid",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/wwog/cordis_wasm"
readme = "README.md"

[workspace.dependencies]
futures = "0.3.31"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonschema = { version = "0.52", default-features = false }
notify-debouncer-mini = "0.7"
proc-macro2 = "1"
quote = "1"
rhai = { version = "1.26", default-features = false, features = ["serde", "sync"] }
rmp-serde = "1"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.2"
syn = { version = "2", features = ["full", "extra-traits"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.1", default-features = false }
tracing = "0.1"
trybuild = "1"
wasmtime = { version = "48.0.1", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "48.0.1", default-features = false, features = ["p2"] }
wat = "1.258.0"
wit-bindgen = "0.61.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace]
members = [
    "crates/cordis",
    "crates/cordis-core",
    "crates/cordis-macros",
    "crates/cordis-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/cordiverse/cordis"

[workspace.dependencies]
futures = "0.3.31"
blake3 = "1"
proc-macro2 = "1"
quote = "1"
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }
tracing = "0.1"
trybuild = "1"
wasmtime = { version = "48.0.1", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std"] }
wat = "1.258.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package]
name = "cordis-cli"
description = "Command-line runner and inspector for Cordis applications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "cordis"
path = "src/main.rs"
doc = false

[dependencies]
cordis-core = { path = "../cordis-core", version = "0.1.0" }
cordis-loader = { path = "../cordis-loader", version = "0.1.0" }
cordis-logger = { path = "../cordis-logger", version = "0.1.0" }
cordis-wasm = { path = "../cordis-wasm", version = "0.1.0" }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[lints]
workspace = true
